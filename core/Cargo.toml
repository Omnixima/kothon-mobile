[package]
name = "kothon-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kothon's on-device Bengali dictation engine for iPhone and Android"

[lib]
# staticlib for the iOS XCFramework, cdylib for Android's jniLibs, rlib for tests.
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["punct"]
# Restore দাঁড়ি, commas and question marks with the MuRIL model (~128 MB).
punct = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:serde_json"]

[dependencies]
anyhow = "1"
once_cell = "1"
log = "0.4"
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
serde_json = { version = "1", optional = true }

# Apple: Metal on the GPU, Accelerate for punctuation. Same as the Mac app.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"] }
candle-core = { version = "0.11.1", optional = true, features = ["accelerate"] }
candle-nn = { version = "0.11.1", optional = true, features = ["accelerate"] }
candle-transformers = { version = "0.11.1", optional = true, features = ["accelerate"] }

# Android and everything else: CPU (NEON on arm64). Vulkan can come later,
# once it's measured to be faster on real phones.
[target.'cfg(not(any(target_os = "ios", target_os = "macos")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[dev-dependencies]
hound = "3.5"
